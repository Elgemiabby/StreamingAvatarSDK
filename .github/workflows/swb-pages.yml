name: Deploy SWB Platform

on:
  push:
    branches:
      - main
    paths:
      - 'swb-site/**'
      - '.github/workflows/swb-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: swb-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Validate site files
        run: |
          test -f swb-site/index.html
          test -f swb-site/app.js
          test -f swb-site/styles.css
          node --check swb-site/app.js
          node --check swb-site/data.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload platform
        uses: actions/upload-pages-artifact@v3
        with:
          path: swb-site
      - name: Deploy platform
        id: deployment
        uses: actions/deploy-pages@v4
