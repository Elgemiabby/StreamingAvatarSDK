name: Deploy SWB Platform

on:
  push:
    branches:
      - swb-prototype-live
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: swb-pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild platform bundle
        run: |
          rm -rf _site
          mkdir -p _site
          base64 --decode swb-v2.tar.gz.b64 > /tmp/swb-v2.tar.gz
          tar -xzf /tmp/swb-v2.tar.gz -C _site
      - name: Validate required files
        run: |
          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/app.js
          test -s _site/data.js
          node --check _site/app.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
