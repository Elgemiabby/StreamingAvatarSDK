name: Deploy SWB Prototype

on:
  push:
    branches:
      - swb-prototype-live
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4
        with:
          ref: swb-prototype-live
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: swb-live
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
