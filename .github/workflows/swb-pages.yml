name: Deploy SWB Platform

on:
  push:
    branches:
      - main
      - swb-prototype-live
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: swb-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform branch
        uses: actions/checkout@v4
        with:
          ref: swb-prototype-live
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload platform
        uses: actions/upload-pages-artifact@v3
        with:
          path: swb-live
      - name: Deploy platform
        id: deployment
        uses: actions/deploy-pages@v4
